<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- The target has its own transform and sits in transformed groups. -->
  <defs>
    <pattern id="checks" patternUnits="userSpaceOnUse" width="16" height="16"
             patternTransform="rotate(-20)">
      <rect width="8" height="8" fill="#555"/>
      <rect x="8" y="8" width="8" height="8" fill="#555"/>
    </pattern>
  </defs>
  <g transform="translate(100 100) rotate(15)">
    <g transform="scale(1.2)">
      <rect id="target" class="target" x="-60" y="-50" width="120" height="100"
            transform="skewX(10)" fill="url(#checks)" style="stroke:#900;stroke-width:3"/>
    </g>
  </g>
</svg>
