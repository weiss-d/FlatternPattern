<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Filled content that goes past the tile box: the tile clip must hide it. -->
  <defs>
    <pattern id="big" patternUnits="userSpaceOnUse" width="25" height="25">
      <circle cx="20" cy="20" r="10" fill="#909"/>
    </pattern>
  </defs>
  <rect id="target" class="target" x="10" y="10" width="180" height="180" fill="url(#big)"/>
</svg>
