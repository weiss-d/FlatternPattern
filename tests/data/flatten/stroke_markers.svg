<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Markers paint above a pattern stroke. A stroke width in em uses the font-size. -->
  <defs>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="3" cy="3" r="2" fill="#06c"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4"
            orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c00"/>
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3">
      <circle cx="5" cy="5" r="5" fill="#0a0"/>
    </marker>
  </defs>
  <!-- Pattern stroke only: the arrow and the dots must stay on top of the stroke. -->
  <path id="arrowed" class="target" d="M 20 30 L 100 30 L 170 70"
        style="fill:none;stroke:url(#dots);stroke-width:12;marker-mid:url(#dot);marker-end:url(#arrow)"/>
  <!-- A color fill and a pattern stroke: the fill paints below the stroke, the markers above. -->
  <path id="filled" class="target" d="M 20 90 H 90 V 150 H 20 Z"
        style="fill:#fd8;stroke:url(#dots);stroke-width:12;marker-start:url(#dot)"/>
  <!-- 0.5em with font-size 40px is 20 user units. -->
  <g style="font-size:40px">
    <path id="em-width" class="target" d="M 120 110 V 180"
          style="fill:none;stroke:url(#dots);stroke-width:0.5em"/>
  </g>
</svg>
