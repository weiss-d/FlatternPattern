<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="200" height="200" viewBox="0 0 200 200">
  <!-- The Inkscape layout: the base has the content and a viewBox, the wrapper
       has the transform and an x offset. -->
  <defs>
    <pattern id="base" patternUnits="userSpaceOnUse" width="20" height="20" viewBox="0 0 10 10">
      <path d="M 0 0 H 5 V 5 H 0 Z M 5 5 H 10 V 10 H 5 Z" fill="#036"/>
    </pattern>
    <pattern id="wrap" xlink:href="#base" x="3" patternTransform="rotate(30) scale(0.8)"/>
  </defs>
  <rect id="target" class="target" x="20" y="20" width="160" height="160" fill="url(#wrap)"/>
</svg>
