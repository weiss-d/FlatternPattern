<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Percentages in the geometry of the targets and of the tile content. They
       refer to the viewport: 200 x 200, normalized diagonal 200. -->
  <defs>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="10" height="10">
      <circle cx="5" cy="5" r="3" fill="#06c"/>
    </pattern>
    <!-- 2% of the width is 4 user units. -->
    <pattern id="bars" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect x="1%" width="2%" height="10" fill="#c00"/>
    </pattern>
  </defs>
  <rect id="rect" class="target" x="5%" y="5%" width="40%" height="45%" fill="url(#dots)"/>
  <circle id="circle" class="target" cx="75%" cy="30%" r="20%" fill="url(#bars)"/>
  <ellipse id="ellipse" class="target" cx="50%" cy="77%" rx="40%" ry="15%" fill="url(#dots)"/>
</svg>
