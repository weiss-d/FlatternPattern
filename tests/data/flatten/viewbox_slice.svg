<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- A viewBox with slice: the content scales past the tile box, so the tile clip cuts it. -->
  <defs>
    <pattern id="slice" patternUnits="userSpaceOnUse" width="30" height="30"
             viewBox="0 0 10 20" preserveAspectRatio="xMidYMax slice">
      <rect width="10" height="20" fill="#ddd"/>
      <path d="M 0 0 L 10 20 M 10 0 L 0 20" style="stroke:#333;stroke-width:1.5"/>
    </pattern>
  </defs>
  <circle id="target" class="target" cx="100" cy="100" r="85" fill="url(#slice)"/>
</svg>
