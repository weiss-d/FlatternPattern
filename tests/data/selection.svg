<svg id="root" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="pat" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="5" height="5" fill="#000"/>
    </pattern>
    <linearGradient id="grad"><stop offset="0" stop-color="#f00"/></linearGradient>
    <hatch id="hat" hatchUnits="userSpaceOnUse" pitch="5"><hatchpath d="M0 0"/></hatch>
    <rect id="in_defs" width="10" height="10" fill="url(#pat)"/>
  </defs>
  <rect id="plain" width="20" height="20" fill="url(#pat)"/>
  <rect id="fallback" x="20" width="20" height="20" style="fill:url(#pat) red"/>
  <rect id="gradient" x="40" width="20" height="20" fill="url(#grad)"/>
  <rect id="hatched" x="60" width="20" height="20" fill="url(#hat)"/>
  <rect id="missing" x="80" width="20" height="20" fill="url(#nothere)"/>
  <rect id="stroked" x="100" width="20" height="20" fill="none" stroke="url(#pat)"/>
  <g id="group" style="fill:url(#pat)">
    <rect id="child1" y="40" width="20" height="20"/>
    <g id="inner"><circle id="child2" cx="50" cy="50" r="10"/></g>
    <clipPath id="clip_in_group"><rect id="clip_rect" width="5" height="5"/></clipPath>
  </g>
  <text id="label" x="10" y="100" fill="url(#pat)">Text</text>
  <use id="clone" xlink:href="#plain" x="0" y="120" fill="url(#pat)"/>
  <text id="spanned" x="10" y="140"><tspan id="span" fill="url(#pat)">A</tspan><tspan fill="url(#pat)">B</tspan></text>
  <flowRoot id="flow"><flowRegion><rect id="frame" width="50" height="50" fill="url(#pat)"/></flowRegion><flowPara>C</flowPara></flowRoot>
  <rect id="bad_ref" x="120" width="20" height="20" fill="url(#plain)"/>
  <image id="picture" x="140" width="20" height="20" fill="url(#pat)"/>
  <text x="10" y="160" fill="url(#pat)">No id</text>
</svg>
