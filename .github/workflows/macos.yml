name: macOS

# Runs the tests with the stable Inkscape release on macOS.
# A separate workflow keeps a failure here out of the CI badge and the required checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      INKSCAPE_COMMAND: /Applications/Inkscape.app/Contents/MacOS/inkscape
      INKSCAPE_EXTENSIONS_DIR: /Applications/Inkscape.app/Contents/Resources/share/inkscape/extensions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Inkscape
        run: |
          brew install --cask inkscape
          "$INKSCAPE_COMMAND" --version
          ls "$INKSCAPE_EXTENSIONS_DIR/inkex"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run pytest -q
