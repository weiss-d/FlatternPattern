name: Windows

# Runs the tests with the stable Inkscape release on Windows.
# A separate workflow keeps a failure here out of the CI badge and the required checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  # Not "test": the main ruleset requires a check with that name.
  test-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # inkscape.com writes to the console. inkscape.exe does not.
      INKSCAPE_COMMAND: C:\Program Files\Inkscape\bin\inkscape.com
      INKSCAPE_EXTENSIONS_DIR: C:\Program Files\Inkscape\share\inkscape\extensions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Inkscape
        run: |
          choco install inkscape -y --no-progress
          & $env:INKSCAPE_COMMAND --version
          Get-ChildItem $env:INKSCAPE_EXTENSIONS_DIR\inkex -Name
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run pytest -q
