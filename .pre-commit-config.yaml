# Install all hook types with: pre-commit install
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: check-xml
        types: [file]
        files: \.(inx|svg|xml)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.1
    hooks:
      - id: uv-lock

  # The scopes are the same as the scopes in CLAUDE.local.md.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - --scopes=inx,core,resolve,tiling,clipped,merged,cleanup,tests,docs,repo
          - feat
          - fix
          - refactor
          - perf
          - test
          - docs
          - build
          - ci
          - style
          - chore

  - repo: local
    hooks:
      # Runs only on a push with a change to pyproject.toml, such as a version bump.
      # A tag push does not run it, because pre-commit skips commits that the remote has.
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        files: ^pyproject\.toml$
        stages: [pre-push]
